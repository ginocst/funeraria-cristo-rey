user www-data;   # mismo usuario que PHP-FPM y dueño de las carpetas temporales de Nginx
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;   # documentos de hasta 8 MB
    keepalive_timeout 65;

    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;

        # Encabezados de seguridad
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API de Laravel y ruta de salud (el resto del sitio es la interfaz, más abajo)
        location /api/ {
            try_files $uri /index.php?$query_string;
        }
        location = /up {
            try_files $uri /index.php?$query_string;
        }
        # Solo con disco local (desarrollo): fotos del catálogo subidas o de la demo, y
        # descarga de documentos con enlace firmado. En AWS esos archivos van por S3
        location /storage/ {
            try_files $uri =404;
        }
        location /archivos/ {
            try_files $uri /index.php?$query_string;
        }

        # Server-Sent Events: sin búfer para que los avisos lleguen al instante
        location = /api/avisos/stream {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_buffering off;
            fastcgi_read_timeout 40s;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_read_timeout 60s;
        }

        # Interfaz (React compilada, copiada a /var/www/web al construir la imagen).
        # Toda ruta que no es un archivo devuelve index.html: así funcionan /solicitudes/1005, etc.
        location / {
            root /var/www/web;
            try_files $uri /index.html;
        }
        location /assets/ {            # archivos con huella en el nombre: se pueden guardar un año
            root /var/www/web;
            expires 1y;
            try_files $uri =404;
        }
        location = /index.html {       # nunca en caché: apunta a los archivos de la versión vigente
            root /var/www/web;
            expires -1;
        }

        location ~ /\.(?!well-known) { deny all; }
    }
}